name: markdownlint

# Lints the project's human-facing markdown (README, CLAUDE.md). Config and
# scope (ignores .claude/** tooling docs) live in .markdownlint-cli2.jsonc.
# This check IS expected to stay green — make it a required status check.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/markdownlint.yml'

permissions:
  contents: read

concurrency:
  group: markdownlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: '**/*.md'
